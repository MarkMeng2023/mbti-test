name: Deploy static site to Aliyun OSS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
      OSS_ENDPOINT: https://oss-${{ secrets.ALIYUN_OSS_REGION }}.aliyuncs.com

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ossutil
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.2.1/ossutil-2.2.1-linux-amd64.zip
          unzip ossutil.zip
          cd ossutil-2.2.1-linux-amd64
          chmod +x ossutil
          sudo mv ossutil /usr/local/bin/ossutil
          ossutil version

      - name: Upload site files to OSS
        run: |
          ossutil cp . oss://${{ secrets.ALIYUN_OSS_BUCKET }}/ \
            --recursive \
            --update \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "node_modules/*" \
            --exclude ".DS_Store"

      - name: List uploaded files
        run: |
          ossutil ls oss://${{ secrets.ALIYUN_OSS_BUCKET }}/
