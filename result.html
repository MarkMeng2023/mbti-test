<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MBTI 风格测试 - 结果</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <div class="nav">
        <div class="brand">
          <div class="logo">✅</div>
          <div id="resultNavTitle">测试结果</div>
          <span class="badge" id="resultBadge">v0.1</span>
        </div>
        <a class="ghost" href="index.html">← 首页</a>
      </div>

      <div class="grid">
        <!-- 左侧：类型 + 四维得分 + 操作按钮 -->
        <div class="card">
          <div class="h1" id="typeTitle">你的类型：----</div>
          <p class="p" id="typeDesc">完成测试后，这里会显示你的类型解释。</p>

          <div class="scoreGrid" id="scoreGrid"></div>

          <!-- 统一后的操作区 -->
          <div class="ctaBox">
            <div class="ctaButtons">
              <button id="shareBtn">生成分享图</button>
              <button id="copyBtn">复制结果文案</button>
              <button id="retryBtn">再测一次</button>
              <button id="homeBtn">回到首页</button>
              <button id="clearBtn" class="primaryBtn">清除本地答题记录</button>
            </div>
          </div>
        </div>

        <!-- 右侧：人格报告 -->
        <div class="card">
          <section class="report">
            <div class="h2">人格报告</div>

            <div class="reportBlock">
              <div class="reportH">核心特征</div>
              <div class="reportP" id="reportSummary">-</div>
            </div>

            <div class="reportGrid">
              <div class="reportBlock">
                <div class="reportH">优势</div>
                <ul id="reportStrengths" class="reportList"></ul>
              </div>

              <div class="reportBlock">
                <div class="reportH">潜在盲点</div>
                <ul id="reportRisks" class="reportList"></ul>
              </div>
            </div>

            <div class="reportBlock">
              <div class="reportH">成长建议</div>
              <ul id="reportTips" class="reportList"></ul>
            </div>

            <div class="reportBlock">
              <div class="reportH">🤝 朋友匹配</div>
              <div class="reportP">
                <div style="font-weight:700; margin-bottom:6px;" id="friendType">-</div>
                <div id="friendReason">-</div>
              </div>
            </div>

            <div class="reportBlock">
              <div class="reportH">❤️ 恋爱匹配</div>
              <div class="reportP">
                <div style="font-weight:700; margin-bottom:6px;" id="loveType">-</div>
                <div id="loveReason">-</div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <canvas id="shareCanvas" width="1080" height="1920" style="display:none;"></canvas>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
